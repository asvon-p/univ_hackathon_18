# Local PostgreSQL 16 + pgvector. Run: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fitjang
      POSTGRES_PASSWORD: fitjang
      POSTGRES_DB: fitjang
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitjang -d fitjang"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
